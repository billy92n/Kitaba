kind = "web"
previewPath = "/"
title = "Kitaba"
version = "1.0.0"
id = "artifacts/kitaba"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18467

[services.development]
run = "pnpm --filter @workspace/kitaba run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kitaba", "run", "build" ]
serve = "static"
publicDir = "artifacts/kitaba/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18467"
BASE_PATH = "/"
