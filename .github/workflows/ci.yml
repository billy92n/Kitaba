name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI clients twice
        run: |
          pnpm --filter @workspace/api-spec run codegen
          pnpm --filter @workspace/api-spec run codegen

      - name: Verify generated clients are committed
        run: git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated

      - name: Check
        run: pnpm run check

      - name: Engine coverage
        run: pnpm run test:coverage

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kitaba
          POSTGRES_PASSWORD: kitaba
          POSTGRES_DB: kitaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitaba -d kitaba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kitaba:kitaba@localhost:5432/kitaba
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test PostgreSQL optimistic concurrency
        run: pnpm --filter @workspace/api-server run test:postgres-concurrency
